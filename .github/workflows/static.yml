# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare transparent master logo
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from collections import deque

          source = "assets/Bubbles & Brew Carwash Cafe Logo.png"
          target = "assets/Bubbles-Brew-master-logo-transparent.png"

          image = Image.open(source).convert("RGBA")
          pixels = image.load()
          width, height = image.size
          threshold = 245
          seen = bytearray(width * height)
          queue = deque()

          def background(x, y):
              r, g, b, a = pixels[x, y]
              return a > 0 and r >= threshold and g >= threshold and b >= threshold

          for x in range(width):
              for y in (0, height - 1):
                  if background(x, y) and not seen[y * width + x]:
                      seen[y * width + x] = 1
                      queue.append((x, y))

          for y in range(height):
              for x in (0, width - 1):
                  if background(x, y) and not seen[y * width + x]:
                      seen[y * width + x] = 1
                      queue.append((x, y))

          while queue:
              x, y = queue.popleft()
              for nx, ny in ((x - 1, y), (x + 1, y), (x, y - 1), (x, y + 1)):
                  if 0 <= nx < width and 0 <= ny < height:
                      index = ny * width + nx
                      if not seen[index] and background(nx, ny):
                          seen[index] = 1
                          queue.append((nx, ny))

          output = image.copy()
          out = output.load()
          for y in range(height):
              for x in range(width):
                  if seen[y * width + x]:
                      r, g, b, a = out[x, y]
                      out[x, y] = (r, g, b, 0)

          output.save(target, "PNG", optimize=True)
          print(f"Created {target} from the official master PNG")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
