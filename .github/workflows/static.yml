# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare transparent master logo
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from collections import deque

          source = "assets/Bubbles & Brew Carwash Cafe Logo.png"
          target = "assets/Bubbles-Brew-master-logo-transparent.png"

          image = Image.open(source).convert("RGBA")
          pixels = image.load()
          width, height = image.size
          threshold = 245
          seen = bytearray(width * height)
          queue = deque()

          def background(x, y):
              r, g, b, a = pixels[x, y]
              return a > 0 and r >= threshold and g >= threshold and b >= threshold

          for x in range(width):
              for y in (0, height - 1):
                  if background(x, y) and not seen[y * width + x]:
                      seen[y * width + x] = 1
                      queue.append((x, y))

          for y in range(height):
              for x in (0, width - 1):
                  if background(x, y) and not seen[y * width + x]:
                      seen[y * width + x] = 1
                      queue.append((x, y))

          while queue:
              x, y = queue.popleft()
              for nx, ny in ((x - 1, y), (x + 1, y), (x, y - 1), (x, y + 1)):
                  if 0 <= nx < width and 0 <= ny < height:
                      index = ny * width + nx
                      if not seen[index] and background(nx, ny):
                          seen[index] = 1
                          queue.append((nx, ny))

          output = image.copy()
          out = output.load()
          for y in range(height):
              for x in range(width):
                  if seen[y * width + x]:
                      r, g, b, a = out[x, y]
                      out[x, y] = (r, g, b, 0)

          output.save(target, "PNG", optimize=True)
          print(f"Created {target} from the official master PNG")
          PY

      - name: Optimize Café Lounge hero for fast first paint
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("assets/cafe/Bubbles & Brew Café Lounge.png")
          target = Path("assets/cafe/cafe-lounge-hero.webp")
          image = Image.open(source).convert("RGB")
          image.save(target, "WEBP", quality=82, method=6)

          media = Path("assets/media.js")
          text = media.read_text(encoding="utf-8")
          text = text.replace(
              "/assets/cafe/Bubbles%20%26%20Brew%20Caf%C3%A9%20Lounge.png",
              "/assets/cafe/cafe-lounge-hero.webp"
          )
          media.write_text(text, encoding="utf-8")

          index = Path("index.html")
          html = index.read_text(encoding="utf-8")
          preload = '<link rel="preload" as="image" href="/assets/cafe/cafe-lounge-hero.webp" type="image/webp" fetchpriority="high">'
          if preload not in html:
              html = html.replace('<link rel="stylesheet" href="/css/app.css">', '<link rel="stylesheet" href="/css/app.css">\n' + preload, 1)
          index.write_text(html, encoding="utf-8")
          print(f"Created optimized Café Lounge image: {target}")
          print("Updated deployment copy of media.js and preloaded the Café image from <head>")
          PY

      - name: Optimize Beauty Parlour hero for fast loading
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("assets/Bubbles&Brew_Beauty_Parlour_Lounge.png")
          target = Path("assets/beauty-parlour-hero.webp")
          image = Image.open(source).convert("RGB")
          image.save(target, "WEBP", quality=82, method=6)

          media = Path("assets/media.js")
          text = media.read_text(encoding="utf-8")
          text = text.replace(
              "/assets/Bubbles%26Brew_Beauty_Parlour_Lounge.png",
              "/assets/beauty-parlour-hero.webp"
          )
          media.write_text(text, encoding="utf-8")
          print(f"Created optimized Beauty Parlour hero: {target}")
          print("Updated deployment copy of media.js to use the optimized Beauty image")
          PY

      - name: Prevent legacy homepage flash in deployed artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path("index.html")
          html = index.read_text(encoding="utf-8")
          pattern = re.compile(
              r"<script>\s*"
              r"/\* Reveal only after the current homepage has been enhanced; never expose the legacy static layer first\. \*/\s*"
              r"document\.documentElement\.classList\.remove\('bb-loading'\);\s*"
              r"document\.body\.classList\.remove\('bb-loading'\);\s*"
              r"</script>",
              re.MULTILINE,
          )
          replacement = """<script>
          /* Reveal only after media.js and hero-slider.js have completed their DOMContentLoaded work. */
          (function () {
            function revealHomepage() {
              document.documentElement.classList.remove('bb-loading');
              document.body.classList.remove('bb-loading');
            }
            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', revealHomepage, { once: true });
            } else {
              revealHomepage();
            }
          })();
          </script>"""
          html, count = pattern.subn(replacement, html, count=1)
          if count != 1:
              raise SystemExit("Homepage reveal block was not found; refusing to deploy an unverified artifact.")
          index.write_text(html, encoding="utf-8")
          print("Homepage reveal is now gated behind DOMContentLoaded")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
